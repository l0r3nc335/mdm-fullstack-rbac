name: Test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Lint, Vitest & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      # npm ci from a Windows-generated lockfile often skips Linux napi optionals
      # (oxlint, rolldown/vite, sharp). Prefer install so the runner OS resolves them.
      - name: Install dependencies
        run: npm install --include=optional --no-fund --no-audit

      - name: Ensure Linux native bindings
        run: |
          npm install --workspace backend \
            @img/sharp-linux-x64@0.35.4 \
            @img/sharp-libvips-linux-x64@1.3.3 \
            sharp
          npm install --workspace frontend \
            @oxlint/binding-linux-x64-gnu@1.83.0 \
            @rolldown/binding-linux-x64-gnu@1.2.8 \
            oxlint

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Backend unit tests
        run: npm run test:run --workspace backend

      - name: Backend build
        run: npm run build --workspace backend

      - name: Frontend lint
        run: npm run lint --workspace frontend

      - name: Frontend unit tests
        run: npm run test:run --workspace frontend

      - name: Frontend build
        run: npm run build --workspace frontend
        env:
          VITE_API_URL: http://localhost:4000/api

  e2e:
    name: Cypress E2E (smoke)
    runs-on: ubuntu-latest
    needs: unit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --include=optional --no-fund --no-audit

      - name: Ensure Linux frontend bindings
        run: |
          npm install --workspace frontend \
            @oxlint/binding-linux-x64-gnu@1.83.0 \
            @rolldown/binding-linux-x64-gnu@1.2.8

      - name: Cypress smoke
        run: npm run test:e2e
        env:
          VITE_API_URL: http://localhost:4000/api
