name: Test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Lint, Vitest & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Linux-native dependencies
        run: bash scripts/ensure-linux-natives.sh

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Backend unit tests
        run: npm run test:run --workspace backend

      - name: Backend build
        run: npm run build --workspace backend

      - name: Frontend lint
        run: npm run lint --workspace frontend

      - name: Frontend unit tests
        run: npm run test:run --workspace frontend

      - name: Frontend build
        run: npm run build --workspace frontend
        env:
          VITE_API_URL: http://localhost:4000/api

  e2e:
    name: Cypress E2E (smoke)
    runs-on: ubuntu-latest
    needs: unit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Linux-native dependencies
        run: bash scripts/ensure-linux-natives.sh

      - name: Cypress smoke
        run: npm run test:e2e
        env:
          VITE_API_URL: http://localhost:4000/api
